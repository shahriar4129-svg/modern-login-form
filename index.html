<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <title>Login | My Portfolio</title>
</head>
<body>

<div class="container" id="container">

<div class="form-container sing-up">
    <form id="signupForm">
        <h1>Create Account</h1> 
        <div class="social-icons">
            <a href="#" class="icon"><i class="fa-brands fa-google-plus-g"></i>
            </a>
            <a href="#" class="icon"><i class="fa-brands fa-facebook-f"></i>
            </a>
            <a href="#" class="icon"><i class="fa-brands fa-github"></i>
            </a>
            <a href="#" class="icon"><i class="fa-brands fa-linkedin-in"></i>
            </a>
            <a href="#" class="icon"><i class="fa-brands fa-instagram"></i>
            </a>

        </div>
        <span>or oue your email for registeration</span>
        <input type="text" placeholder="Name" id="suName">
        <input type="email" placeholder="Email" id="suEmail">
        <input type="password" placeholder="password" id="suPass">
        <button type="submit">Sign Up</button>
    </form>
</div>

<div class="form-container sing-in">
    <form id="signinForm">
      <h1>Sign in</h1>
        <div class="social-icons">
            <a href="#" class="icon"><i class="fa-brands fa-google-plus-g"></i>
            </a>
            <a href="#" class="icon"><i class="fa-brands fa-facebook-f"></i>
            </a>
            <a href="#" class="icon"><i class="fa-brands fa-github"></i>
            </a>
            <a href="#" class="icon"><i class="fa-brands fa-linkedin-in"></i>
            </a>
            <a href="#" class="icon"><i class="fa-brands fa-instagram"></i>
            </a>

        </div>
        <span>or use your email password  </span>
        <input type="email" placeholder="Email" id="siEmail">
        <input type="password" placeholder="Password" id="siPass">
        <a href="#">Forget Your Password?</a>
        <button type="submit">Sign In</button>
    </form>
</div>
<div class="toggle-container">
    <div class="toggle">
        <div class="toggle-panel toggle-left">
            <h1>Welcome Back</h1>
            <p>Enter Your personal details to use all of site featurs</p>
            <button class="hidden" id="login">Sing In</button>
        </div>
            <div class="toggle-panel toggle-right">
            <h1>Hello,Friend</h1>
            <p>Register with your personal details to use all of site featurs</p>
            <button class="hidden" id="register">Sign Up</button>
            </div>
        </div>
    </div>
</div>



    <script src="script.js"></script>
    
</body>
</html>
